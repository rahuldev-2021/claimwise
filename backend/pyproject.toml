[project]
name = "claimwise"
version = "0.1.0"
description = "AI-Driven Automotive Repair Claim Validation and Decision Support System"
requires-python = ">=3.11"

[project.optional-dependencies]
nlp = ["spacy>=3.7,<4"]
rag = ["sentence-transformers>=3.0,<4"]
ml = ["pandas>=2,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]
ml-xgb = ["xgboost>=2,<3"]
llm-gemini = ["google-genai>=1.0,<2"]
llm-openai = ["openai>=1.0,<2"]
llm-litellm = ["litellm>=1.60.0,<2", "openai>=1.0,<2"]
llm-anthropic = ["anthropic>=0.40,<1"]

[tool.pytest.ini_options]
markers = [
    "rag_models: tests that require sentence-transformers model download",
    "llm_live: tests that call a live LLM API (require credentials)",
    "financial_ml: tests that require pandas and scikit-learn",
]

testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
